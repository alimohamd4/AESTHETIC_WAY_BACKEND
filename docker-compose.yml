version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: aesthetic_way_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aesthetic_way}
      POSTGRES_USER: ${DB_USER:-aesthetic_way}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aesthetic_way_secure_pw}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aesthetic_way} -d ${DB_NAME:-aesthetic_way}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aesthetic_way_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aesthetic_way_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:-aesthetic_way_production_secret_key_minimum_50_chars_long}
      - DEBUG=False
      - DB_NAME=${DB_NAME:-aesthetic_way}
      - DB_USER=${DB_USER:-aesthetic_way}
      - DB_PASSWORD=${DB_PASSWORD:-aesthetic_way_secure_pw}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aesthetic_way_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "-c", "4"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:-aesthetic_way_production_secret_key_minimum_50_chars_long}
      - DEBUG=False
      - DB_NAME=${DB_NAME:-aesthetic_way}
      - DB_USER=${DB_USER:-aesthetic_way}
      - DB_PASSWORD=${DB_PASSWORD:-aesthetic_way_secure_pw}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aesthetic_way_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "-l", "INFO"]
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - SECRET_KEY=${SECRET_KEY:-aesthetic_way_production_secret_key_minimum_50_chars_long}
      - DEBUG=False
      - DB_NAME=${DB_NAME:-aesthetic_way}
      - DB_USER=${DB_USER:-aesthetic_way}
      - DB_PASSWORD=${DB_PASSWORD:-aesthetic_way_secure_pw}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
